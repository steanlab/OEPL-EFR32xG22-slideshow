name: Build OEPL Newton Core firmware

on:
  push:
    branches:
      - main
      - slideshow
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Prepare images
        run: |
          shopt -s nullglob
          rm -rf work_images && mkdir work_images
          zips=(slideshow_src/*.zip)
          if [ ${#zips[@]} -gt 1 ]; then
            echo "ERROR: slideshow_src must contain exactly one zip, found ${#zips[@]}:"
            printf '  %s\n' "${zips[@]}"
            exit 1
          elif [ ${#zips[@]} -eq 1 ]; then
            echo "Using archive: ${zips[0]}"
            unzip -q -o -j "${zips[0]}" -x '__MACOSX/*' -d work_images
          else
            echo "No zip found, trying loose images from slideshow_src"
            cp -f slideshow_src/* work_images/ 2>/dev/null || true
          fi
          ls -1 work_images

      - name: Generate slideshow images
        run: |
          pip install pillow
          python tools/gen_images.py work_images firmware/images.h 200 200 0 --tone tools/tone_curve.json --palette tools/palette.json --preview preview.png --budget 205000

      - name: Upload preview sheet
        uses: actions/upload-artifact@v4
        with:
          name: slideshow-preview
          path: preview.png
          if-no-files-found: ignore
          
      - name: Build Docker builder image
        run: |
          docker build \
            --no-cache \
            -t silabs-builder \
            -f Dockerfile \
            .

      - name: Make build script executable
        run: chmod +x build_all.sh

      - name: Build firmware inside container
        run: |
          docker run --rm \
            --user 0:0 \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            silabs-builder \
            sh -c "slc signature trust --sdk /gecko_sdk/ && ./build_all.sh"

      - name: Firmware size
        run: |
          python3 - <<'EOF'
          import glob
          LIMIT = 335872
          for p in sorted(glob.glob('firmware/**/*.hex', recursive=True)):
              total = 0
              for line in open(p):
                  line = line.strip()
                  if line.startswith(':') and line[7:9] == '00':
                      total += int(line[1:3], 16)
              print(f"{p}: {total} bytes used, {LIMIT - total} bytes free ({100.0 * total / LIMIT:.1f}% of {LIMIT})")
          EOF

      - name: List firmware outputs
        run: |
          echo "Firmware files found:"
          find . -type f \( -name "*.s37" -o -name "*.bin" -o -name "*.hex" \) -print

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newton-core-oepl-firmware
          retention-days: 30
          if-no-files-found: error
          path: |
            **/*.s37
            **/*.bin
            **/*.hex
